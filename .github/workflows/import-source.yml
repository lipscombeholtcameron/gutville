name: Import prepared Gutville source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify prepared source archive
        run: echo "ff48ea7b4b3c53f2df4f27ea60554a156aa180814dcfe7eb0da1290f9246baf3  gutville-source.tar.gz" | sha256sum --check --status
      - name: Import the reviewed source files
        run: |
          tar --extract --gzip --file gutville-source.tar.gz --no-same-owner
          rm gutville-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish complete Gutville source"
          git push
